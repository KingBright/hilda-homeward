name: Game quality gate
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/build.mjs', 'package.json', 'index.html', '.github/workflows/quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: |
          if test -f package.json; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Deterministic build and unit tests
        if: steps.source.outputs.ready == 'true'
        run: |
          npm run check
          git diff --exit-code -- index.html hilda-homeward-v2.html dev.html build-manifest.json
      - name: Install browser test dependencies
        if: steps.source.outputs.ready == 'true'
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Complete adventure and input regressions
        if: steps.source.outputs.ready == 'true'
        run: |
          mkdir -p previews
          python tests/playthrough.py
      - name: Native HTTP and file-origin persistence
        if: steps.source.outputs.ready == 'true'
        run: python tests/native-storage.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.ready == 'true'
        with:
          name: game-quality-evidence
          path: |
            test-report.json
            native-storage-report.json
            tests/failure-state.json
            previews/
            index.html
            build-manifest.json
          retention-days: 14
