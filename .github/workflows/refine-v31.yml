name: Publish verified V3.1 refinement
on:
  push:
    branches: [main]
    paths: ['tools/v31-delta.*', 'tools/apply-v31.py', '.github/workflows/refine-v31.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v31
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: source
        run: |
          if test -f tools/apply-v31.py; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Validate source preimages, apply refinement and build
        if: steps.source.outputs.ready == 'true'
        run: |
          python tools/apply-v31.py
          npm run check
          echo 'bc5eb2de2e3f7643e16852c4bb023f4d8222d72ac2ca0ee5b5e3341d4ff35e9d  index.html' | sha256sum -c
          git diff --check
      - name: Install browser verification dependencies
        if: steps.source.outputs.ready == 'true'
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Complete twelve scenes and input, acting and puzzle regressions
        if: steps.source.outputs.ready == 'true'
        run: |
          mkdir -p previews
          python tests/playthrough.py
      - name: Verify native HTTP and file-origin persistence
        if: steps.source.outputs.ready == 'true'
        run: python tests/native-storage.py
      - name: Commit verified readable source to main without rewriting history
        if: steps.source.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs tools/build.mjs README.md package.json index.html hilda-homeward-v2.html dev.html build-manifest.json
          git rm tools/apply-v31.py tools/v31-delta.0 tools/v31-delta.1 tools/v31-delta.2 tools/v31-delta.3
          git commit -m 'feat: refine rain-night adventure with contact acting and coherent cooperative puzzles'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.ready == 'true'
        with:
          name: v31-quality-evidence
          path: |
            test-report.json
            native-storage-report.json
            tests/failure-state.json
            tests/fixtures.json
            previews/
            index.html
            build-manifest.json
          retention-days: 14
