name: Publish verified V3.3 cast and score
on:
  push:
    branches: [main]
    paths: ['tools/apply-v33.py', '.github/workflows/refine-v33.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v33
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: source
        run: |
          if test -f tools/apply-v33.py; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Verify source preimages, apply refinement and rebuild
        if: steps.source.outputs.ready == 'true'
        run: |
          python tools/apply-v33.py
          npm run check
          sha256sum -c .v33-expected.sha256
          git diff --check
      - name: Install pinned browser test tools
        if: steps.source.outputs.ready == 'true'
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Complete all chapters and interaction regressions
        if: steps.source.outputs.ready == 'true'
        run: |
          mkdir -p previews
          python tests/playthrough.py
      - name: Cast rendering and real Web Audio checks
        if: steps.source.outputs.ready == 'true'
        run: python tests/art-audio.py
      - name: Native HTTP and file-origin storage
        if: steps.source.outputs.ready == 'true'
        run: python tests/native-storage.py
      - name: Commit only verified source and build to main
        if: steps.source.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md package.json .github/workflows/quality.yml index.html hilda-homeward-v2.html dev.html build-manifest.json
          git rm tools/apply-v33.py
          git commit -m 'feat: refine the full cast and add authored adaptive music with persistent mixing'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.ready == 'true'
        with:
          name: v33-quality-evidence
          path: |
            test-report.json
            art-audio-report.json
            native-storage-report.json
            tests/failure-state.json
            previews/
            index.html
            build-manifest.json
          retention-days: 14
