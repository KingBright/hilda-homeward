/* src/engine/modules.js */
/** Small dependency registry. No globals besides Homeward, no runtime packages. */
(function (root) {
  'use strict';
  const definitions = new Map();
  const instances = new Map();
  const resolving = new Set();
  function define(id, dependencies, factory) {
    if (definitions.has(id)) throw new Error('Duplicate module: ' + id);
    definitions.set(id, { dependencies, factory });
  }
  function use(id) {
    if (instances.has(id)) return instances.get(id);
    if (resolving.has(id)) throw new Error('Circular module dependency: ' + id);
    const entry = definitions.get(id);
    if (!entry) throw new Error('Missing module: ' + id);
    resolving.add(id);
    try {
      const value = entry.factory(...entry.dependencies.map(use));
      instances.set(id, value);
      return value;
    } finally { resolving.delete(id); }
  }
  root.Homeward = Object.freeze({ define, use, modules: () => [...definitions.keys()] });
})(globalThis);

  this.ambMaster=this.ctx.createGain();
  this.ambMaster.gain.value=0.75;
  this.ambMaster.connect(this.master);
  this.bgmMaster=this.ctx.createGain();
  this.bgmMaster.gain.value=0.85;
  this.bgmMaster.connect(this.master);
  this.sfxMaster=this.ctx.createGain();
  this.sfxMaster.gain.value=1.0;
  this.sfxMaster.connect(this.master);
  this.ambient=-1;
  this.bgmTimer=null;
  this.tickTimer=null;
  this.seqIndex=0;
  this.initNoise();
  this.initAmbienceGraph();
 }
 async resume(){if(this.ctx.state==='suspended')await this.ctx.resume();}
 initNoise(){
  try{
   const len=this.ctx.sampleRate*3;
   this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
   const d=this.noiseBuf.getChannelData(0);
   let b0=0,b1=0,b2=0;
   for(let i=0;i<len;i++){
    const white=Math.random()*2-1;
    b0=0.99886*b0+white*0.0555179;b1=0.99332*b1+white*0.0750759;b2=0.96900*b2+white*0.1538520;
    d[i]=(b0+b1+b2+white*0.5362)*0.18;
   }
  }catch{this.noiseBuf=null;}
 }
 initAmbienceGraph(){
  if(!this.noiseBuf)return;
  try{
   this.noiseSrc=this.ctx.createBufferSource();
   this.noiseSrc.buffer=this.noiseBuf;
   this.noiseSrc.loop=true;
   this.windFilter=this.ctx.createBiquadFilter();
   this.windFilter.type='bandpass';this.windFilter.frequency.value=320;this.windFilter.Q.value=2.2;
   this.windLfo=this.ctx.createOscillator();this.windLfo.frequency.value=0.18;
   this.windLfoGain=this.ctx.createGain();this.windLfoGain.gain.value=180;
   this.windLfo.connect(this.windLfoGain);this.windLfoGain.connect(this.windFilter.frequency);
   this.windLfo.start();
   this.windGain=this.ctx.createGain();this.windGain.gain.value=0;
   this.windFilter.connect(this.windGain);this.windGain.connect(this.ambMaster);
   this.rainFilter=this.ctx.createBiquadFilter();this.rainFilter.type='highpass';this.rainFilter.frequency.value=1400;
   this.rainGain=this.ctx.createGain();this.rainGain.gain.value=0;
   this.rainFilter.connect(this.rainGain);this.rainGain.connect(this.ambMaster);
   this.streamFilter=this.ctx.createBiquadFilter();this.streamFilter.type='bandpass';this.streamFilter.frequency.value=680;this.streamFilter.Q.value=3.5;
   this.streamGain=this.ctx.createGain();this.streamGain.gain.value=0;

/* src/engine/hydraulics.js */
/** Elbow connectivity in clockwise quarter-turns: N/E, E/S, S/W, W/N.
 * The renderer and puzzle share this graph, not independent answer tables.
 */
Homeward.define('engine/hydraulics', [], () => {
  const ports = Object.freeze([['N','E'],['E','S'],['S','W'],['W','N']]);
  const edges = [ {S:[1,'N']}, {N:[0,'S'],E:[2,'W']}, {W:[1,'E']} ];
  function trace(rotations, enabled = true) {
    if (!Array.isArray(rotations) || rotations.length !== 3 || rotations.some(v => !Number.isInteger(v) || v < 0 || v > 3)) {
      throw new TypeError('Three valid pipe rotations are required');
    }
    const wet = [], leaks = [];
    let index = 0, inlet = 'W';
    if (!enabled) return {connected:false, wet, leaks, pressure:0};
    for (let visits = 0; visits < 4; visits++) {
      const open = ports[rotations[index]];
      if (!open.includes(inlet)) { leaks.push({node:index,port:inlet}); break; }
      wet.push(index);
      const outlet = open.find(p => p !== inlet);
      if (index === 2 && outlet === 'N') return {connected:true,wet,leaks,pressure:1};
      const edge = edges[index][outlet];
      if (!edge) { leaks.push({node:index,port:outlet}); break; }
      [index,inlet] = edge;
      if (wet.includes(index)) break;
    }
    return {connected:false,wet,leaks,pressure:wet.length / 4};
  }
  return Object.freeze({ports,trace});
});

function stepTypewriter(){
 if(!typewriter.busy)return;
 if(modal||document.hidden){typewriter.timer=setTimeout(stepTypewriter,100);return;}
 if(typewriter.index>=typewriter.fullText.length){
  $('line').textContent=typewriter.fullText;
  typewriter.busy=false;
  typewriter.timer=null;
  return;
 }
 const char=typewriter.fullText[typewriter.index];
 typewriter.index++;
 $('line').textContent=typewriter.fullText.slice(0,typewriter.index);
 if(s.settings.sound&&audio&&!/[\s，。！？、…—·：；“”‘’「」\.\,\!\?]/.test(char)){
  if(typewriter.index%2===1)audio.speechBlip(typewriter.who);
 }
 const delay=/[，、；]/.test(char)?110:/[。！？…\.]/.test(char)?180:28;
 typewriter.timer=setTimeout(stepTypewriter,s.settings.reduced?10:delay);
}
function nextLine(){

  if(typewriter.timer){clearTimeout(typewriter.timer);typewriter.timer=null;}
  typewriter.busy=false;
  $('line').textContent=typewriter.fullText;
  return;

 if(dialogue.index>=dialogue.lines.length){
  const cb=dialogue.after;

  $('speech').classList.add('hidden');

}

Homeward.define("engine/state", ["story"], (Story) => {
const boolFlags=new Set(('letter promise lampTaken awning crankTaken crankMounted gateOpen ropeTaken hookTaken grappleSet bridge archiveTalk planTaken filter pump lineTaken lift shadePlaced calm towerGate feltTaken bypassMounted bypass damped fridaHold davidHold heart roofAnchor davidSafe fridaSafe beacon twigSafe roofDone reunited hug ended gearSTaken gearMTaken gearLTaken gearSSet gearMSet gearLSet trail0 trail1 trail2 hood0 hood1 hood2 tea0 tea1 tea2 branchBent poleTaken pumpPrimed gearAligned').split(' '));

const milestones=['','promise','gateOpen','bridge','planTaken','pump','lift','calm','towerGate','heart','roofDone','reunited'];
const sketches={mountain:['妈妈画的山','画里那条小路，最后总会回到有灯的窗前。'],city:['雨里倒着一座城','灯光在水洼里摇晃，像有人把另一座城藏到了脚下。'],elf:['精灵的雨天条款','第八十二条：未经本人同意，雨滴不得落在已批准的文件上。'],oldFriends:['门上的两个手印','一个小小的人类手印，挨着一个大大的巨魔手印。时间没有把它们分开。'],dawn:['天终于亮了','害怕没有一夜之间消失。但天亮时，我们学会了牵着它继续走。'],return:['同一扇窗','昨夜世界那么大。清晨，所有的路都回到了这扇窗。']};
function fresh(){return {version:3,scene:0,inventory:[],f:{},notes:[],sketches:[],visited:[],seen:[],valves:[0,1,0],weights:[],melody:[],beaconAngle:-65,danger:0,hints:Array(12).fill(0),failures:0,heroX:660,playSeconds:0,settings:{sound:false,relaxed:false,reduced:(globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches??false)},savedAt:null};}
function validate(v){
 if(!v||typeof v!=='object'||Array.isArray(v)||![2,3].includes(v.version))throw Error('这不是受支持的归途 V2 / V3 存档。原来的进度不会被覆盖。');
 const num=(x,a,b)=>typeof x==='number'&&Number.isFinite(x)&&x>=a&&x<=b;
 const arr=(x,p,max=100)=>Array.isArray(x)&&x.length<=max&&x.every(p);
 if(!Number.isInteger(v.scene)||!num(v.scene,0,11))throw Error('存档中的场景编号无效。');
 if(!v.f||typeof v.f!=='object'||Array.isArray(v.f))throw Error('存档的剧情状态损坏。');
 const o=fresh();o.scene=v.scene;
 for(const [k,value] of Object.entries(v.f)){if(boolFlags.has(k)){if(typeof value!=='boolean')throw Error('剧情标记无效：'+k);o.f[k]=value;}else if(numericFlags[k]){if(!num(value,...numericFlags[k]))throw Error('机关位置无效：'+k);o.f[k]=value;}else throw Error('未知的剧情标记：'+k);}
 const checks={inventory:[x=>typeof x==='string'&&Object.hasOwn(Story.items,x),20],notes:[x=>typeof x==='string'&&Object.hasOwn(Story.notes,x),30],sketches:[x=>typeof x==='string'&&Object.hasOwn(sketches,x),6],visited:[x=>Number.isInteger(x)&&num(x,0,11),12],seen:[x=>Number.isInteger(x)&&num(x,0,11),12],weights:[x=>Number.isInteger(x)&&num(x,1,3),3],melody:[x=>Number.isInteger(x)&&num(x,0,2),3]};
 for(const [k,[p,max]] of Object.entries(checks)){if(!arr(v[k],p,max))throw Error('存档中的 '+k+' 列表无效。');o[k]=[...new Set(v[k])];if(k==='melody')o[k]=v[k].slice();}
 if(!arr(v.valves,x=>Number.isInteger(x)&&num(x,0,3),3)||v.valves.length!==3)throw Error('管路状态损坏。');o.valves=v.valves.slice();
 if(!arr(v.hints,x=>Number.isInteger(x)&&num(x,0,3),12)||v.hints.length!==12)throw Error('提示状态损坏。');o.hints=v.hints.slice();
 for(const [k,a,b] of [['heroX',60,1540],['beaconAngle',-180,180],['danger',0,1],['playSeconds',0,1e8],['failures',0,1e6]]){if(!num(v[k],a,b))throw Error('存档中的 '+k+' 数值无效。');o[k]=v[k];}
 if(!v.settings||['sound','relaxed','reduced'].some(k=>typeof v.settings[k]!=='boolean'))throw Error('设置状态无效。');o.settings={sound:v.settings.sound,relaxed:v.settings.relaxed,reduced:v.settings.reduced};
 for(let i=1;i<=o.scene;i++){if(!o.f[milestones[i]])throw Error('存档缺少前序章节进度，无法安全继续。');}
 if(o.f.ended&&(!o.f.reunited||!o.f.hug||![0,1,2].every(i=>o.f['tea'+i])))throw Error('结局记录不完整。');
 if(v.version===2){
   if(o.f.pump)o.f.pumpPrimed=true;
   if(o.f.towerGate){o.f.gearAligned=true;o.f.gearIndex=3;}
   // The old waterworks rewarded this reusable tool. Restore it only after the reward flag.
   if(o.f.filter){o.f.poleTaken=true;if(!o.inventory.includes('pole'))o.inventory.push('pole');}
 }
 if(o.f.gearIndex!==undefined&&!Number.isInteger(o.f.gearIndex))throw Error('齿轮刻度必须是整数。');
 if(o.f.pump&&!o.f.pumpPrimed)throw Error('水泵缺少试压记录。');
 if(o.f.towerGate&&!o.f.gearAligned)throw Error('钟楼缺少对位记录。');
 o.savedAt=typeof v.savedAt==='string'?v.savedAt:null;return o;
}

return {fresh,validate,boolFlags,numericFlags,sketches};
});

/* src/engine/storage.js */
/** Keep the last validated snapshot. A corrupt primary never poisons its backup. */
Homeward.define('engine/storage', [], () => {
  class SaveStore {
    constructor(storage,validate,key='hilda-echoes-homeward-v3') {
      this.storage=storage;this.validate=validate;this.key=key;
      this.backup=key+'-backup';this.lastGood=null;this.recovered=false;
    }
    load() {
      for (const key of [this.key,this.backup,'hilda-echoes-homeward-v2','hilda-echoes-homeward-v2-backup']) {
        try {
          const raw=this.storage.getItem(key); if(!raw) continue;
          const value=this.validate(JSON.parse(raw));
          this.lastGood=JSON.stringify(value);this.recovered=key!==this.key;
          return value;
        } catch { /* Try the next independently validated copy. */ }
      }
      return null;
    }
    save(state) {
      const value=JSON.stringify(this.validate(state));
      if(this.lastGood) this.storage.setItem(this.backup,this.lastGood);
      this.storage.setItem(this.key,value);
      this.lastGood=value;
    }
  }
  return SaveStore;
});

Homeward.define("story/helpers", ["content/catalog", "engine/hydraulics", "content/mechanisms"], ({items}, Hydraulics, Mechanisms) => {
const H=(id,label,x,y,w,h,extra={})=>({id,label,x,y,w,h,...extra});
const I=(id,label,x,y,w=58,h=66,extra={})=>H(id,label,x,y,w,h,{kind:'take',...extra});
const exit=(id,label,x,y,extra={})=>H(id,label,x,y,94,168,{kind:'exit',...extra});
const f=(g,k)=>!!g.s.f[k];
const say=(g,lines,after)=>g.say(lines,after);
const one=(g,who,line)=>say(g,[[who,line]]);
const wrong=(g)=>g.toast('这两样暂时还派不上用场。试着先观察机关本身。');
const set=(g,k,val=true)=>g.set(k,val);
const need=(g,item,selected,text)=>{if(selected===item)return true;g.toast(text||`先在背包里选中「${items[item]}」，再点这里。`);return false;};
const advance=(g,condition,id,line)=>condition?g.go(id):one(g,'希尔达',line);
const book=(g,k)=>g.note(k);
function pipeCheck(g){if(f(g,'pumpPrimed')&&f(g,'filter')&&Hydraulics.trace(g.s.valves,true).connected&&!f(g,'pump')){set(g,'pump');book(g,'surge');g.effect('water');say(g,[['希尔达','水走对路了。升降机应该能动了。'],['芙丽达','等一下……下面那扇旧闸，也被水压推开了。'],['大卫','所以那个越来越大的声音，不是好消息？']],()=>g.toast('远处传来沉重的轰鸣。必须继续向山里走。'));}}
function balance(g,v){if(f(g,'lift'))return g.toast('轿厢已经停稳，安全锁扣住了配重。不要再拆动它。');g.s.weights=g.s.weights.includes(v)?g.s.weights.filter(x=>x!==v):[...g.s.weights,v];g.commit();g.sound('metal');let sum=g.s.weights.reduce((a,b)=>a+b,0);g.toast(sum===4?'横梁水平了。现在可以松开制动。':sum<4?'吊盘太轻，横梁向左沉。':'吊盘太重，横梁向右沉。');}
function lightTrail(g,id,item){let i=Number(id.slice(-1));if(item==='lamp'||item==='shade'){if(!f(g,'hood'+i))return one(g,'希尔达','风会从这里灌进去。先转一下灯罩。');set(g,'trail'+i);g.sound('warm');g.toast('一盏回家的灯亮了。');if([0,1,2].every(j=>f(g,'trail'+j)))say(g,[['大卫','山那边……也亮了。'],['阿尔弗','她看见我们了！现在带孩子走过去。']]);}else if(!f(g,'hood'+i)){set(g,'hood'+i);g.toast('灯罩转到了背风侧。可以用提灯点火了。');}else g.toast(f(g,'trail'+i)?'这盏灯会一直亮到天明。':'在背包里选小提灯，再点这盏路灯。');}

function checkBeacon(g){if(Math.abs(g.s.beaconAngle-Math.atan2(Mechanisms.beacon.target[1]-Mechanisms.beacon.pivot[1],Mechanisms.beacon.target[0]-Mechanisms.beacon.pivot[0])*180/Math.PI)<Mechanisms.beacon.tolerance&&!f(g,'beacon')){set(g,'beacon');g.sound('warm');g.toast('光落在山脊星标上。云雾里，一只沃夫回应了你。');}else g.toast('调整光轴，让指针指向远处左上方的星标。');}

function maybeFinish(g){if(f(g,'hug')&&[0,1,2].every(i=>f(g,'tea'+i))&&!f(g,'ended')){set(g,'ended');book(g,'home');g.finish();}}
return {maybeFinish,checkBeacon,H,I,exit,f,say,one,wrong,set,need,advance,book,pipeCheck,balance,lightTrail};
});

/* src/story/index.js */
Homeward.define("story", ["content/catalog", "content/details", "scene/0/logic", "scene/1/logic", "scene/2/logic", "scene/3/logic", "scene/4/logic", "scene/5/logic", "scene/6/logic", "scene/7/logic", "scene/8/logic", "scene/9/logic", "scene/10/logic", "scene/11/logic"], (catalog, details, scene0, scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9, scene10, scene11) => {

const scenes=[scene0,scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,scene10,scene11];
const notes={...catalog.notes};
scenes.forEach((scene,index)=>{
  const detail=details[index],hotspots=scene.hotspots,act=scene.act;
  notes[detail.note]=[detail.title,detail.body];
  scene.hotspots=state=>[...hotspots(state),{...detail,label:'仔细看看 · '+detail.title,kind:'observe'}];
  scene.act=(game,id,item)=>{
    if(id!=='detail')return act(game,id,item);
    game.note(detail.note);game.say([['希尔达',detail.body]]);
  };
});
return {...catalog,notes,scenes};
});
