<script>
/* src/engine/modules.js */
/** Small dependency registry. No globals besides Homeward, no runtime packages. */
(function (root) {
  'use strict';
  const definitions = new Map();
  const instances = new Map();
  const resolving = new Set();
  function define(id, dependencies, factory) {
    if (definitions.has(id)) throw new Error('Duplicate module: ' + id);
    definitions.set(id, { dependencies, factory });
  }
  function use(id) {
    if (instances.has(id)) return instances.get(id);
    if (resolving.has(id)) throw new Error('Circular module dependency: ' + id);
    const entry = definitions.get(id);
    if (!entry) throw new Error('Missing module: ' + id);
    resolving.add(id);
    try {
      const value = entry.factory(...entry.dependencies.map(use));
      instances.set(id, value);
      return value;
    } finally { resolving.delete(id); }
  }
  root.Homeward = Object.freeze({ define, use, modules: () => [...definitions.keys()] });
})(globalThis);

/* src/art/cast-design.js */
/** Shared production drawings: the stage actor and dialogue portraits use the
 * same head/costume layers. No independent portrait-only redesigns or bitmaps. */
Homeward.define('art/cast-design', [], () => {
 const ink='#263c48';
 const p=(d,f='none',s=ink,w=1.55,extra='')=>`<path d="${d}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
 const e=(x,y,rx,ry,f,s='none',w=1)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${s}" stroke-width="${w}"/>`;
 const profiles={
  '希尔达':{skin:'#f3cda8',shade:'#dca17e',hair:'#398eaa',light:'#77c6d5',coat:'#b75848',coatLight:'#dd8770',coatDark:'#7f3c39',scarf:'#c64f45',trousers:'#314652'},
  '大卫':{skin:'#efc8a1',shade:'#cc9979',hair:'#855d3e',light:'#ba8a58',coat:'#b18545',coatLight:'#d7b779',coatDark:'#7f623c',scarf:'#6b8e8b',trousers:'#3d5361'},
  '芙丽达':{skin:'#ae7653',shade:'#80503e',hair:'#302e30',light:'#55403a',coat:'#ccaa58',coatLight:'#ead28b',coatDark:'#988044',scarf:'#638b8b',trousers:'#344952'},
  '妈妈':{skin:'#efd0af',shade:'#d3a086',hair:'#64483e',light:'#906b53',coat:'#8d6470',coatLight:'#b99093',coatDark:'#634550',scarf:'#c6bb91',trousers:'#394950'}
 };
 const defs=`<defs>
  <pattern id="cast-knit" width="6" height="5" patternUnits="userSpaceOnUse"><path d="M1 1l1 2 1-2m2 3 1 1" fill="none" stroke="#fff2d1" stroke-opacity=".2" stroke-width=".55"/></pattern>
  <linearGradient id="cast-fur" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#fff7df"/><stop offset=".6" stop-color="#e8ead9"/><stop offset="1" stop-color="#adc6c9"/></linearGradient>
  <linearGradient id="cast-rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9bafa7"/><stop offset=".48" stop-color="#778e8a"/><stop offset="1" stop-color="#4b6569"/></linearGradient>
  <linearGradient id="cast-woff" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#ead9b7"/><stop offset=".6" stop-color="#c2b493"/><stop offset="1" stop-color="#8da2a0"/></linearGradient>
 </defs>`;
 function expression(scene=0,flags={},who='希尔达'){
  if(scene===9&&!flags.roofDone){if(who==='大卫'&&!flags.davidSafe||who==='芙丽达'&&!flags.fridaSafe)return 'worried';return 'resolve';}
  if(scene===8&&!flags.heart)return 'resolve';
  if(scene===6&&!flags.calm)return 'gentle';
  return scene>=10?'relieved':'curious';
 }
 function eyes(c,mood='curious',rig=false){
  const worried=mood==='worried',resolve=mood==='resolve',happy=mood==='relieved';
  const brows=worried?'M-13-122q5-5 10-2m12-1q6-2 11 2':resolve?'M-13-125l10 4m12 0 10-5':'M-13-123q5-3 10-1m12-1q5-2 10 1';
  const mouth=worried?'M1-94q5-5 10 0':happy?'M-1-96q7 9 14-1':resolve?'M1-94q5 1 10-1':'M0-95q6 5 12-1';
  return `<g ${rig?'id="rigEyes"':'class="cast-blink"'}>${e(-7,-112,5.8,7.4,'#fff4da')}${e(13,-111,5.4,7.1,'#fff4da')}${e(-5.4,-111,2.9,4.8,ink)}${e(14.7,-110,2.8,4.6,ink)}${e(-4.5,-113,1,1.5,'#fff9ed')}${e(15.5,-112,1,1.4,'#fff9ed')}${p('M-13-117q5-5 10-1m11-1q5-4 10 1','none',c.hair,1.1)}</g>${p(brows,'none',c.hair,1.6,rig?'id="rigBrows"':'')}${p('M3-109q-1 6 3 6','none',c.shade,1.3)}${p(mouth,'none',c.hair,1.25,rig?'id="rigMouth"':'')}${e(-13,-101,4,2,c.shade)}${e(20,-100,3,1.8,c.shade)}`;
 }
 function hairBack(who,c){
  if(who==='希尔达')return p('M-22-139Q-45-127-35-106L-38-88-32-91-35-72-28-77-22-61-13-69 12-61 27-72 25-64Q43-89 28-121L22-140Z',c.hair)+p('M-27-127q-11 19-4 39m8-25q-7 31 4 43m42-44q9 22-1 39','none',c.light,1.6);
  if(who==='芙丽达')return p('M-24-125Q-43-123-34-109-46-99-33-88-42-72-25-68-24-58-12-65 3-55 13-64 32-57 32-70 49-76 36-89 45-103 32-111 41-128 23-134Z',c.hair)+p('M-29-101q-9 5-1 12m-4 9q-3 7 5 8m60-32q10 3 1 9m0 12q9 2 2 8','none',c.light,2);
  if(who==='妈妈')return p('M-22-134Q-38-119-28-81Q-8-69 29-81L28-128Z',c.hair)+p('M-26-115q-4 25 3 30m44-27q8 19 2 31','none',c.light,1.6);
  return p('M-26-123q-5 23 6 33l6-8 25 7 13-17-6-19Z',c.hair);
 }
 function head(who,mood='curious',rig=false){
  const c=profiles[who]||profiles['妈妈'];
  let front='';
  if(who==='希尔达')front=p('M-26-129q-2-19 21-18 18-8 30 10l5 17-10-5-2 6-14-11q-6 15-19 17l2-12-12 15Z',c.hair)+p('M-22-133q13-14 28-10m-11 7q-3 12-12 15m26-19 12 12','none',c.light,2)+p('M-28-141q-10-10 7-16l12-3q23-10 37 6l8 13q-23-7-44 2Z','#304757')+p('M-20-150q19-10 35-2','none','#527183',1.7)+p('M2-162l2-6','none',ink,2.3);
  else if(who==='大卫')front=p('M-29-119q-9-17 4-22l-3-9 14 2q8-14 19-4l11-5 3 11q13-2 14 9 7 9-4 16l-9-10q-3 9-14 11l3-11q-12 11-23 9l-6 11Z',c.hair)+p('M-21-139q10 2 17-6m9 6q8-6 15 0m-31 13 12-5','none',c.light,1.8)+p('M-16-103h2m3 1h1m26-1h2','none','#b8835b',1.2);
  else if(who==='芙丽达')front=p('M-28-120q-16-10-5-22-1-16 13-16 10-13 22-7 13-9 24 3 18-2 18 14 14 11 1 20l-8 16-6-18q-10 8-14-1-11 9-16 0-7 10-18 11Z',c.hair)+p('M-24-143q-7-5-1-9m8-5q8-7 11 0m12-3q10-6 13 5m9 7q12 2 6 9m-56-5q7-7 12-1m14-5q10-5 13 4','none',c.light,2.2)+p('M22-132l8-8','none','#d7ba71',2.8);
  else front=p('M-28-124q-4-27 20-29 26-9 37 14l1 25-8-14q-16 6-19-9-12 17-29 23Z',c.hair)+p('M-22-134q10-15 21-14m7 5q12 1 16 10','none',c.light,1.8);
  return `<g ${rig?'id="rigHead"':''} data-cast-head="${who}" data-mood="${mood}">${p('M-20-128Q-5-141 18-132L25-119 24-100Q19-84 3-86-15-86-21-103Z',c.skin)}${p('M-19-108q-11-9-11 2 0 9 10 9',c.skin)}${p('M-24-109q-3 2 0 6','none',c.shade,1.3)}${p('M-15-91q14 11 31-5l-3 8q-13 9-27-1Z',c.shade,'none')}${eyes(c,mood,rig)}${front}${who==='妈妈'?e(-26,-98,2,3,'#dec989',ink,.8):''}</g>`;
 }
 function upper(who,rig=false,mood='curious'){
  const c=profiles[who]||profiles['妈妈'],hilda=who==='希尔达',mom=who==='妈妈';
  const torso=p('M-23-82Q-8-92 18-83L27-44Q5-38-25-45Z',c.coat)+p('M-22-74l7-9 3 34 27 3 10-4 2 7q-28 7-51 0Z',c.coatDark,'none')+p('M-12-80Q1-85 14-79L20-54-14-54Z',c.coatLight,'none')+p('M-12-80Q1-85 14-79L20-54-14-54Z','url(#cast-knit)','none')+p('M-2-78V-49M-21-48H22','none',c.coatDark,1.15)+p('M-10-57h9v8h-10m15-8h10v8H5','none',c.coatLight,1.1)+[0,1,2].map(i=>e(1,-72+i*8,1.2,1.2,'#ecd5a4')).join('');
  return `<g ${rig?'id="rigUpper"':''} data-costume="${who}">${hairBack(who,c)}${p('M-20-82q-18 0-16 18l3 19 17 4 6-26Z','#64594c')}${p('M-32-66l15 3-2 11-12-2Z','#a27e55')}${p('M-26-73l4 1v8l-5-1Z','#d6b77c')}${hilda?p('M-21-53H20L29-29Q1-25-28-29Z','#334552')+p('M-15-51l-4 20m18-21v22m14-21 7 19','none','#536574',1.2):''}${mom?p('M-20-61L-32-23Q2-16 32-25L19-64Z',c.coatDark):''}${torso}${p('M-13-85Q-17-68-13-46','none','#544b40',4.2)}${p('M-13-81v21','none','#bc9764',1.4)}${p('M-15-62h5v7h-5Z','#d9bd83',ink,.8)}${who==='芙丽达'?p('M16-67l7 3-3 8-8-3Z','#d2c49c',ink,1)+p('M16-61l2-3 2 4','none','#55756c',1):''}${head(who,mood,rig)}${p('M-22-91Q-3-86 22-93L24-83Q6-77-22-82Z',c.scarf)}${p('M-18-86q19 6 37-2','none',hilda?'#ed9b77':'#a4beb0',1.4)}${p('M17-84Q32-86 45-74L41-63 32-64 33-71 18-75Z',c.scarf,ink,1.4,rig?'id="rigScarf"':'class="cast-scarf"')}${p('M-21-48H21','none','#e2be8a',.7)}</g>`;
 }
 function boot(x,y,back=false){return p(`M${x-6} ${y-8}l12 0 1 7q12 1 13 8l-27 0Z`,back?'#745442':'#92674b')+p(`M${x-6} ${y+5}h25v3h-27Z`,'#34434a')+p(`M${x-3} ${y-5}l8 2m-7 2 9 2`,'none','#d5bb8f',1)+p(`M${x+9} ${y+2}q4-1 7 2`,'none','#b58e65',1);}
 function standing(who,mood='curious'){
  const c=profiles[who]||profiles['妈妈'];

/* src/art/cast-motion.js */
/** Distance-driven companion gait. No simulation state or puzzle flags are written. */
Homeward.define('art/cast-motion', [], () => {
 const tracks=new WeakMap();
 function animate(root,time,reduced=false,action=null){
  for(const id of ['davidFollow','fridaFollow','roofDavid','roofFrida']){
   const actor=root.querySelector('#'+id);if(!actor)continue;
   const value=actor.getAttribute('transform')||'',match=/translate\(([-\d.]+)/.exec(value),x=Number(match?.[1]||0);
   let track=tracks.get(actor);if(!track){track={x,time,distance:0,movingUntil:0};tracks.set(actor,track);}
   const dx=x-track.x;
   if(Math.abs(dx)>.04&&Math.abs(dx)<55){track.distance+=Math.abs(dx);track.movingUntil=time+.075;}
   track.x=x;track.time=time;
   const moving=!reduced&&time<track.movingUntil&&action?.score.effect!=='roofBoard'&&!actor.classList.contains('bracing');
   const angle=moving?Math.sin(track.distance/19)*11:0;
   actor.dataset.gait=moving?'walking':'idle';
   for(const [name,sign] of [['back',-1],['front',1]]){
    const leg=actor.querySelector('.cast-leg-'+name);if(leg)leg.setAttribute('transform',`rotate(${(angle*sign).toFixed(2)} ${sign<0?-11:13} -43)`);
   }
  }
 }
 return {animate};
});

/** The playable actor: anchored feet, articulated arms and contact-driven tools. */
Homeward.define('art/performer', ['engine/kinematics','art/cast-design'], ({solve},Cast) => {
  const path=(id,d,fill,stroke='#24434a',width=2)=>`<path id="${id}" d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round"/>`;
  const limb=(id,color,width)=>path(id,'M0 0L0 1','none','#203c45',width+3)+path(id+'Fill','M0 0L0 1','none',color,width);
  function markup(){return `<g id="performer" data-cast="希尔达" transform="scale(1.36)"><ellipse id="rigShadow" cy="3" rx="28" ry="5" fill="#0b2c353d"/>
    ${limb('rigLegBack','#2b404e',9)}<g id="rigBootBack"></g>
    ${limb('rigLegFront','#354b59',10)}<g id="rigBootFront"></g>
    ${Cast.upper('希尔达',true)}
    ${limb('rigArmBack','#a95043',9)}<ellipse id="rigHandBack" rx="4.4" ry="5.5" fill="#efc49d" stroke="#35464e" stroke-width="1.3"/>
    ${limb('rigArmFront','#c66d57',10)}<ellipse id="rigHandFront" rx="4.8" ry="5.8" fill="#f3cda8" stroke="#35464e" stroke-width="1.3"/>
    <g id="rigTool" pointer-events="none"></g>

  let cachedRoot=null,nodes={};
  const mix=(a,b,t)=>a+(b-a)*t;
  const p=(a,b,t)=>[mix(a[0],b[0],t),mix(a[1],b[1],t)];
  const fixed=n=>Number(n).toFixed(2);
  function paint(root,{x,y,face,time,distance,moving,reduced,action,selected,scene=0,flags={},speaking=false}){
    if(!root)return;
    if(root!==cachedRoot){cachedRoot=root;nodes={};root.querySelectorAll('[id]').forEach(el=>nodes[el.id]=el);}
    const attr=(id,k,v)=>nodes[id]?.setAttribute(k,v);
    const draw=(id,origin,target,a,b,bend,color)=>{
      const joint=solve(origin,target,a,b,bend),d=`M${origin.map(fixed)}L${joint.elbow.map(fixed)}L${joint.end.map(fixed)}`;
      attr(id,'d',d);attr(id+'Fill','d',d);return joint.end;
    };
    const score=action?.score,frame=action?.sample(),reach=frame?.reach||0,effort=frame?.effort||0;
    const phase=distance/28,walk=moving&&!reduced?Math.sin(phase):0;
    let crouch=['crouch','clear','tie'].includes(score?.kind)?reach*15:['pull','haul','lever'].includes(score?.kind)?reach*7:0;
    if(moving&&!reduced)crouch+=3;
    const lean=score&&['pull','haul','throw','clear','lever'].includes(score.kind)?reach*(['pull','haul'].includes(score.kind)?-7:7):0;
    const bob=moving&&!reduced?-Math.abs(Math.cos(phase))*1.4:reduced?0:Math.sin(time*2.1)*.4;
    const off=[lean,crouch+bob];attr('rigUpper','transform',`translate(${fixed(off[0])} ${fixed(off[1])})`);
    attr('rigHead','transform',`rotate(${fixed(reach*(score?.kind==='tool'?-8:score?.kind==='clear'?7:0))} 0 -87)`);
    attr('rigEyes','transform',!reduced&&!score&&time%5.6>5.44?'translate(0 -103) scale(1 .12) translate(0 103)':'');
    const mood=Cast.expression(scene,flags,'希尔达'),resolve=!!score||mood==='resolve';
    attr('rigBrows','d',resolve?'M-13-125l10 4m12 0 10-5':'M-13-123q5-3 10-1m12-1q5-2 10 1');
    attr('rigMouth','d',speaking&&!reduced&&Math.sin(time*15)>.1?'M0-95q6-2 12 0q-5 8-12 0Z':resolve?'M1-94q5 1 10-1':mood==='relieved'?'M-1-96q7 9 14-1':'M0-95q6 5 12-1');
    attr('rigMouth','fill',speaking&&!reduced&&Math.sin(time*15)>.1?'#8e534a':'none');
    const wind=reduced?0:Math.sin(time*3)*2+Math.abs(walk)*4;
    attr('rigScarf','d',`M16-82Q31 ${-74-wind} 44 ${-70-wind}L37 ${-61-wind} 18-70Z`);
    for(const [name,sign] of [['Back',-1],['Front',1]]){
      const step=(distance/(1.36*60)+(sign<0?.5:0))%1;
      const stride=moving&&!reduced?(step<.5?15-step*60:-15+(step-.5)*60):0;
      const lift=moving&&!reduced&&step>=.5?Math.sin((step-.5)*Math.PI*2)*9:0;
      const climbing=score?.kind==='climb'&&!reduced;
      const rung=climbing?Math.sin(frame.progress*24+sign*Math.PI/2):0;
      const foot=[sign*11+stride+(climbing?3:0),-3-lift-(climbing?Math.max(0,rung)*19:0)];

    }
    let target=[27+walk*12,-38],back=[-27-walk*11,-40];
    if(score?.target){
      let world=[...score.target];
      if(score.effect==='ladderSlide')world[0]+=(score.to-score.from)*effort;
      if(score.kind==='turn'){const angle=(1-effort)*Math.PI;world[0]+=Math.cos(angle)*(score.radius||20);world[1]+=Math.sin(angle)*(score.radius||20);}
      if(score.kind==='pull')world[1]+=effort*(score.travel||24);

      if(score.kind==='climb'&&!reduced){
        const reaching=frame.progress>.43&&frame.progress<.69;
        target=reaching?p(target,local,reach):[22,-98-Math.sin(frame.progress*24)*16];
        back=[-16,-97+Math.sin(frame.progress*24)*16];
      }
      else if(score.kind==='lever'){target=p(target,[34,-70-effort*17],reach);back=p(back,[15,-67-effort*17],reach);}
      else if(score.kind==='tool'){target=p(target,[28,-97],reach);back=p(back,[3,-75],reach);}
      else if(score.kind==='throw'){target=p(target,[25+Math.sin(effort*Math.PI)*18,-92-Math.sin(effort*Math.PI)*27],reach);}
      else {target=p(target,local,reach);back=p(back,[local[0]-14,local[1]+9],reach*.85);}
    }
    const handBack=draw('rigArmBack',[-19+off[0],-79+off[1]],back,22+reach*5,23+reach*5,action?-1:1);
    const hand=draw('rigArmFront',[17+off[0],-79+off[1]],target,22+reach*6,23+reach*5,action?1:-1);
    for(const [name,h] of [['Back',handBack],['Front',hand]]){attr('rigHand'+name,'cx',fixed(h[0]));attr('rigHand'+name,'cy',fixed(h[1]));}
    let tool='';
    attr('rigShadow','opacity',score?.kind==='climb'&&!reduced?'.15':'1');
    if(score?.kind==='climb'&&frame.progress>.57&&frame.progress<.98){tool=`<g transform="translate(${hand[0]-13} ${hand[1]-9})"><rect width="27" height="36" rx="2" fill="#d0bb81" stroke="#365751" stroke-width="2"/><path d="M7 9h13M7 15h13M7 21h9" stroke="#607e6a" stroke-width="1.5"/></g>`;}
    else if(['tool','lever'].includes(score?.kind)&&reach>.1){let tip=[...score.target];
      if(score.kind==='lever'){const t=Math.max(0,Math.min(1,(frame.progress-.12)/.35)),a=t*t*(3-2*t)*24*Math.PI/180,dx=tip[0]-1225,dy=tip[1]-720;tip=[1225+dx*Math.cos(a)-dy*Math.sin(a),720+dx*Math.sin(a)+dy*Math.cos(a)];}
      const tx=(tip[0]-x)/1.36*face,ty=(tip[1]-y)/1.36;
      tool=`<path d="M${hand[0]-6} ${hand[1]+18}L${tx} ${ty+4}q5-12 10-5" fill="none" stroke="#253d43" stroke-width="5" stroke-linecap="round"/><path d="M${hand}L${tx} ${ty+4}" stroke="#ccb384" stroke-width="3"/>`;
    }else if(score?.prop==='rope'&&reach>.1){tool=`<ellipse cx="${hand[0]}" cy="${hand[1]+12}" rx="12" ry="15" fill="none" stroke="#c4ad7d" stroke-width="3"/>`;}
    else if(!action&&['lamp','shade'].includes(selected)){tool=`<g transform="translate(${hand[0]} ${hand[1]+13})"><circle r="23" fill="#e5ba5830"/><path d="M-6-5V-12Q0-22 6-12V-5" fill="none" stroke="#b49767" stroke-width="2"/><rect x="-9" y="-5" width="18" height="23" rx="4" fill="#dab779" stroke="#635444" stroke-width="2"/><path d="M0 14Q-8 5 0 0Q6 8 0 14" fill="#fff0b0"/></g>`;}
    if(nodes.rigTool&&nodes.rigTool.innerHTML!==tool)nodes.rigTool.innerHTML=tool;
    root.dataset.pose=score?.kind||(moving?'walk':'idle');
    root.dataset.phase=frame?.phase||'idle';
  }
  return {markup,paint};
});

/** Elbow connectivity in clockwise quarter-turns: N/E, E/S, S/W, W/N.

function isPaused(){return modal||document.hidden||titleMode;}
function canAct(){return started&&!isPaused()&&!dialogue&&!locked&&!activeWork&&!sequenceActive;}
function walkLimit(x){if(s.scene===2&&!s.f.bridge)return clamp(x,135,545);if(s.scene===9&&!s.f.davidSafe)return clamp(x,200,466);if(s.scene===10&&!s.f.reunited)return clamp(x,145,1036);return clamp(x,90,1510);}
function walkTo(x,after){x=walkLimit(x);if(!inspection)camera.manual=false;hero.face=x<hero.x?-1:1;if(Math.abs(x-hero.x)<8){after?.();return;}pendingMove={target:x,after};$('hoverLabel').classList.remove('show');}
/** Pointer, keyboard, inventory drops and scene drags use the same arrival boundary. */
function arriveAndAct(h,item,invoke){
 const scene=s.scene,request=sceneRequest;
 walkTo(h.walkX??h.x,()=>{
  if(request!==sceneRequest||scene!==s.scene||!canAct())return;
  const live=Story.scenes[scene].hotspots(s).find(v=>v.id===h.id);
  if(!live||item&&(!s.inventory.includes(item)||!Items.canUse(scene,h.id,item)))return;
  hero.face=live.x<hero.x?-1:1;
  currentInteraction={scene,id:h.id,item};
  try{invoke();if(item&&selected===item){selected=null;renderInventory();}save();}
  catch(e){console.error('Interaction failed:',e);toast('动作没有完成，物品和进度仍保留。可以重新尝试。');}
  finally{currentInteraction=null;}
 });
}
function interact(id,itemOverride){

let typewriter={timer:null,fullText:'',index:0,who:'',busy:false};
function say(lines,after){if(!Array.isArray(lines)||!lines.length){after?.();return;}pendingMove=null;dialogue={lines,index:0,after};toggleBag(false);$('speech').classList.remove('hidden');showLine();}
function showLine(){
 if(!dialogue)return;
 const [who,line]=dialogue.lines[dialogue.index];
 $('speaker').textContent=who;
 $('portrait').innerHTML=Art.portrait(who);
 $('nextLine').innerHTML=dialogue.index===dialogue.lines.length-1?'继续 <span>›</span>':'继续 <span>›</span>';

 typewriter.busy=true;
 $('line').textContent='';

}
function stepTypewriter(){
 if(!typewriter.busy)return;
 if(modal||document.hidden){typewriter.timer=setTimeout(stepTypewriter,100);return;}
 if(typewriter.index>=typewriter.fullText.length){
  $('line').textContent=typewriter.fullText;
  typewriter.busy=false;
  typewriter.timer=null;
  return;
 }
 const char=typewriter.fullText[typewriter.index];
 typewriter.index++;
 $('line').textContent=typewriter.fullText.slice(0,typewriter.index);
 if(s.settings.sound&&audio&&!/[\s，。！？、…—·：；“”‘’「」\.\,\!\?]/.test(char)){
  if(typewriter.index%2===1)audio.speechBlip(typewriter.who);
 }
 const delay=/[，、；]/.test(char)?110:/[。！？…\.]/.test(char)?180:28;
 typewriter.timer=setTimeout(stepTypewriter,s.settings.reduced?10:delay);
}
function nextLine(){
 if(!dialogue||modal)return;
 if(typewriter.busy){
  if(typewriter.timer){clearTimeout(typewriter.timer);typewriter.timer=null;}
  typewriter.busy=false;
  $('line').textContent=typewriter.fullText;
  return;
 }
 dialogue.index++;
 if(dialogue.index>=dialogue.lines.length){
  const cb=dialogue.after;
  dialogue=null;
  $('speech').classList.add('hidden');
  cb?.();
  save();
 }else showLine();
}

/** Pure, seekable staging. An interrupted performance has no permanent effects. */
Homeward.define('engine/setpiece-motion', ['engine/action-track','content/setpieces'], ({smooth}, Stage) => {
  const segment=(p,a,b)=>smooth((p-a)/(b-a));
  const mix=(a,b,t)=>a+(b-a)*t;
  function actor(base,action,reduced=false) {
    if(!action)return {...base};
    const c=action.score,p=action.sample().progress,e=action.sample().effort;
    if(reduced)return {...base};
    if(c.effect==='ladderSlide')return {...base,x:c.origin.x+(c.to-c.from)*e};
    if(c.effect==='archiveBook') {
      const climb=segment(p,.10,.43)*(1-segment(p,.69,.95));
      const position=segment(p,0,.14)*(1-segment(p,.93,1));
      return {...base,x:mix(base.x,c.ladder+5,position),y:base.y-Stage.archive.climb*climb};
    }
    if(c.effect==='roofBoard')return {...base,x:mix(base.x,1392,segment(p,.08,.68)),y:mix(base.y,575,segment(p,.08,.68))-Math.sin(segment(p,.08,.68)*Math.PI)*25};
    return {...base};
  }
  function cast(state,action,reduced=false) {
    const f=state.f,c=action?.score,p=action?.sample().progress??0;
    let david=f.roofBrace?[...Stage.roof.brace]:f.davidSafe?[...Stage.roof.safe]:[...Stage.roof.david];
    let frida=f.fridaSafe?[842,759]:[1160,773],twig=[929,723];
    if(!reduced&&c?.effect==='roofRescue') {
      const t=segment(p,.34,.90);david=[mix(670,466,t),mix(710,767,t)-Math.sin(t*Math.PI)*58];
    }
    if(!reduced&&c?.effect==='roofBrace') {
      const t=segment(p,.12,.88),x=mix(466,1069,t);david=[x,Stage.roofGround(x)];
    }
    if(!reduced&&c?.effect==='roofLever') {
      const t=segment(p,.43,.84);frida=[mix(1160,842,t),mix(773,759,t)];
    }
    if(!reduced&&c?.effect==='roofTwig') {
      const t=segment(p,.23,.85);twig=[mix(929,c.origin.x+45,t),mix(723,c.origin.y,t)-Math.sin(t*Math.PI)*64];
    }
    if(!reduced&&c?.effect==='roofBoard') {
      const t=segment(p,.05,.78);
      david=[mix(david[0],1368,t),mix(david[1],578,t)];frida=[mix(frida[0],1428,t),mix(frida[1],578,t)];
    }

    return {david,frida,twig};
  }
  return {segment,actor,cast};
});

/** Keep the last validated snapshot. A corrupt primary never poisons its backup. */
Homeward.define('engine/storage', [], () => {
  class SaveStore {
    constructor(storage,validate,key='hilda-echoes-homeward-v3') {
      this.storage=storage;this.validate=validate;this.key=key;
      this.backup=key+'-backup';this.lastGood=null;this.recovered=false;
    }
    load() {
      for (const key of [this.key,this.backup,'hilda-echoes-homeward-v2','hilda-echoes-homeward-v2-backup']) {
        try {
          const raw=this.storage.getItem(key); if(!raw) continue;
          const value=this.validate(JSON.parse(raw));
          this.lastGood=JSON.stringify(value);this.recovered=key!==this.key;
          return value;
        } catch { /* Try the next independently validated copy. */ }
      }
      return null;
    }
    save(state) {
      const value=JSON.stringify(this.validate(state));
      if(this.lastGood) this.storage.setItem(this.backup,this.lastGood);
      this.storage.setItem(this.key,value);
      this.lastGood=value;
    }
  }
  return SaveStore;
});

  hotspots:s=>[
    H('david','询问大卫',735,688,108,183),

  act(g,id,item){
    if(id==='david')return one(g,'大卫',f(g,'gateOpen')?'看，三格都亮了，棘爪稳稳咬住齿轮了。我跟你一起去。':'曲柄在摊位上。先拉下右边的绳圈，把湿透的棚布卷起来。');

  hints:()=>['雨棚、曲柄和转轮，构成了一套小小的修缮顺序。','下拉右侧绳圈，卷好棚布。拿起曲柄，选中后点转轮。','装好曲柄后再操作转轮三次。刻度和门的高度会告诉你进度。']

Homeward.define('scene/2/logic', ['story/helpers'], ({H,I,exit,f,say,one,set,need,advance,book,wrong}) => ({
  name:'溪水逆流的森林',english:'THE STREAM RUNS BACKWARDS',actLabel:'第一幕 · 跟着回声走',

  ground:(x,s)=>{if(s?.f?.bridge&&x>=500&&x<=1090){if(x<550)return 771+(x-500)/50*(706-771);if(x<=1040)return 706+Math.sin((x-550)/490*Math.PI)*20-(x-550)*.035;return 689+(x-1040)/50*(768-689);}return x<550?771:x>1090?768:771+Math.sin((x-550)/540*Math.PI)*22;},
  intro:[['希尔达','看那些落叶。钟声之后，它们竟然往上游漂了。'],['大卫','桥也断了。我们先站在结实的地方，好不好？'],['希尔达','好。先弄清楚绳子连着哪里，再动绞盘。']],

  act(g,id,item){

    if(id==='hook'){
      if(f(g,'hookTaken'))return;
      if(!f(g,'branchBent')){
        if(item!=='rope')return say(g,[['希尔达','铁钩缠在藤上。树枝很有弹性，不能直接爬上去。'],['大卫','地上的绳圈，或许能套住藤蔓，把它拉低。']]);

Homeward.define('scene/3/logic', ['story/helpers','content/setpieces'], ({H,I,exit,f,say,one,set,advance,book}, Stage) => {

    chapter:['ACT II','山里藏着什么','越往深处走，钟声越不像警报。'],

    hotspots:s=>[H('alfur','和阿尔弗交谈',406,524,104,140,{walkX:480}),
      H('ladder','握住侧杆，移动档案梯',Stage.ladderX(s),643,112,260,{drag:'ladder',walkX:Stage.ladderX(s)-62}),
      H('ladderBrake',s.f.ladderBrake?'松开梯脚刹车':'锁住梯脚刹车',Stage.ladderX(s)+82,777,48,54,{walkX:Stage.ladderX(s)+38}),
      I('book',s.f.planTaken?'翻看水钟档案':'爬梯取出带水滴的档案',1170,342,76,122,{walkX:Stage.ladderX(s)-17}),
      H('record','看看精灵公告',339,351,219,264,{walkX:480}),exit('next','通向旧水道',1460,658,{walkX:1406}),exit('back','返回森林',152,685,{walkX:210})],
    act(g,id) {
      if(id==='alfur'){set(g,'archiveTalk');return one(g,'阿尔弗',f(g,'planTaken')?'先让水经过旁路，再让钟安静。顺序不能反过来。':'轨道刻线和书脊图案是对应的。推到水滴刻线，踩下梯脚旁的刹车，才能上去。');}
      if(id==='ladder')return move(g,Stage.nextDock(g.s));
      if(id==='ladderBrake')return g.work(650,'踩下梯脚的黄铜锁杆',()=>{set(g,'ladderBrake',!f(g,'ladderBrake'));g.sound('metal');g.toast(f(g,'ladderBrake')?'轮子停稳了。现在可以检查梯子上方的书。':'锁杆抬起来了，梯子可以沿轨道移动。');});

        if(f(g,'planTaken'))return one(g,'阿尔弗','水钟本来是用来保护山里所有居民的。图纸边上写着：先稳住，再伸手。');

    hints:s=>['轨道的刻线，对应书脊上的图案。','把梯子移到最右侧的水滴刻线，然后锁住右侧梯脚的刹车。','点梯子可切换停靠位，也可以左右拖动。对准水滴后，点梯脚刹车，再点高处那本浅黄色档案。']
  };
});

Homeward.define('scene/4/logic', ['story/helpers','engine/hydraulics','content/walkways'], ({H,exit,f,say,one,set,need,advance,pipeCheck,wrong},Hydraulics,Walkways) => ({
  name:'沉睡的回流水泵',english:'THE SLEEPING WATERWORKS',actLabel:'第二幕 · 山里藏着什么',
  mood:'旧水道 / 修好一处机关，才看见下一层真相',start:561,
  ground:Walkways.waterworksGround,
  intro:[['芙丽达','我从升降站顺着水声找下来的。你们也听到了？'],['希尔达','是的。城门、溪流，似乎都在受同一台机器影响。'],['芙丽达','先看右上角的检修牌。水安静，不代表它没有力气。']],
  hotspots:s=>[
    H('intake',s.f.intakeClosed?'打开进水闸':'关闭进水闸',350,682,86,94,{walkX:307}),
    H('filter','检查并清理进水滤网',453,640,111,147,{walkX:409}),
    H('pipe0','用挑杆旋转高处弯管',640,400,109,109,{walkX:618}),
    H('pipe1','旋转左下弯管',640,570,109,109,{walkX:617}),
    H('pipe2','旋转右下弯管',940,570,109,109,{walkX:911}),
    H('prime','缓缓拉下试压柄',1128,668,110,90,{walkX:1095}),
    H('gauge','查看压力表和检修牌',1128,473,158,183,{walkX:1110}),
    exit('next','上到升降站',1474,611,{walkX:1396}),exit('back','回档案室',142,588,{walkX:246})
  ],
  act(g,id,item){
    if(id==='intake'){
      if(f(g,'pump'))return g.toast('水泵已经接入升降机，进水闸被运行锁扣住了。');
      const closing=!f(g,'intakeClosed');
      return g.work(900,closing?'握住手轮，关闭滤网前的进水闸':'缓缓打开进水闸，观察低压试水',()=>{set(g,'intakeClosed',closing);g.sound(closing?'metal':'water');g.toast(closing?'水停了。现在可以取开滤网上的落叶。':f(g,'filter')?'低压试水开始。沿着亮起的管路，找到第一处漏点。':'进水恢复了，但滤网仍被落叶堵住。');});
    }
    if(id==='filter'){
      if(f(g,'filter'))return g.toast('滤网已经畅通，长柄挑杆收在背包里。');
      if(!f(g,'intakeClosed'))return say(g,[['希尔达','滤网被水顶住了，不能硬拉。'],['芙丽达','左下方手轮的连杆，通向滤网前面。先关进水闸。']]);
      return g.work(1250,'扶住滤网，分次取出落叶和水草',()=>{
        set(g,'filter');set(g,'poleTaken');g.take('pole',false);g.sound('wood');
        say(g,[['希尔达','里面还卡着一根检修挑杆。木柄很长，弯头也完整。'],['芙丽达','上到检修台，用它拨动最高的弯管。接好以后再开闸试水，看水实际走到哪里。']]);
      });
    }
    if(id==='prime'){
      if(f(g,'pump'))return g.toast('水泵正在稳定运行。所有接头都已锁紧。');
      if(!f(g,'filter'))return one(g,'芙丽达','先关进水闸，把滤网上的落叶清掉。');
      if(f(g,'intakeClosed'))return one(g,'芙丽达','水路接好了也得有水。先打开左下方的进水闸。');
      if(!Hydraulics.trace(g.s.valves,true).connected)return one(g,'芙丽达','水还没有到右上方出口。沿水流找第一处漏点，不必把接好的部分重来一遍。');
      return g.work(1500,'缓慢拉下试压柄，确认表针进入运行区',()=>{set(g,'pumpPrimed');pipeCheck(g);});
    }
    if(id.startsWith('pipe')){
      if(f(g,'pump'))return g.toast('已经加到工作压力。接头锁紧了，不能继续拆动。');

        if(!f(g,'roofAnchor'))return one(g,'大卫','别直接跳过来！先固定绳子！');

        return g.work(2400,'请大卫沿安全绳到横梁旁，稳住支点',()=>{set(g,'roofBrace');g.sound('wood');g.toast('大卫已稳住支点。现在用长挑杆帮助芙丽达。');});
      }

        if(f(g,'fridaSafe'))return one(g,'芙丽达','沃夫会循光而来。转动信标下面的检修轮，让光照到左上方的山脊星标。');

      }
      if(id==='beacon')return aim(g,g.s.beaconAngle-21<-178?-45:g.s.beaconAngle-21);
      if(id==='twig') {
        if(!f(g,'davidSafe'))return one(g,'希尔达','枝枝，待在原地。我先把安全绳拉好。');

      }
      if(id==='star')g.toast('星标在灯的左上方。低处检修轮旁的星形刻线，标出了相同方向。');
    },
    drag(g,id,p){if(id!=='beacon')return false;aim(g,Stage.wheelAngle(p));return true;},
    objective:s=>!s.f.roofAnchor?'先将救援绳固定到近处铁环。':!s.f.davidSafe?'把绳端送给大卫，扶他返回稳固屋面。':!s.f.roofBrace&&!s.f.fridaSafe?'请大卫到横梁旁稳住支点。':!s.f.fridaSafe?'用长挑杆和同伴协作，帮助芙丽达脱困。':!s.f.beacon?'转动低处检修轮，把信标照向山脊星标。':!s.f.twigSafe?'带上枝枝，谁也不落下。':'同伴齐全了，一起登上沃夫。',
    hints:s=>['先建立安全条件，再伸手帮助同伴。退回检查点不会撤销已完成的救援。','救回大卫后，再和他互动，请他稳住横梁支点；然后用长挑杆帮助芙丽达。','救援绳用于铁环 → 点大卫救回 → 再点大卫稳住支点 → 挑杆用于芙丽达 → 点低处检修轮三次 → 点枝枝 → 点沃夫。舒缓模式可关闭计时。']
  };
});

/* src/story/helpers.js */
Homeward.define("story/helpers", ["content/catalog", "engine/hydraulics", "content/mechanisms"], ({items}, Hydraulics, Mechanisms) => {
const H=(id,label,x,y,w,h,extra={})=>({id,label,x,y,w,h,...extra});
const I=(id,label,x,y,w=58,h=66,extra={})=>H(id,label,x,y,w,h,{kind:'take',...extra});
const exit=(id,label,x,y,extra={})=>H(id,label,x,y,94,168,{kind:'exit',...extra});
const f=(g,k)=>!!g.s.f[k];
const say=(g,lines,after)=>g.say(lines,after);
const one=(g,who,line)=>say(g,[[who,line]]);
const wrong=(g)=>g.toast('这两样暂时还派不上用场。试着先观察机关本身。');
const set=(g,k,val=true)=>g.set(k,val);
const need=(g,item,selected,text)=>{if(selected===item)return true;g.toast(text||`先在背包里选中「${items[item]}」，再点这里。`);return false;};
const advance=(g,condition,id,line)=>condition?g.go(id):one(g,'希尔达',line);
const book=(g,k)=>g.note(k);
function pipeCheck(g){if(f(g,'pumpPrimed')&&f(g,'filter')&&!f(g,'intakeClosed')&&Hydraulics.trace(g.s.valves,true).connected&&!f(g,'pump')){set(g,'pump');book(g,'surge');g.effect('water');say(g,[['希尔达','水走对路了。升降机应该能动了。'],['芙丽达','等一下……下面那扇旧闸，也被水压推开了。'],['大卫','所以那个越来越大的声音，不是好消息？']],()=>g.toast('远处传来沉重的轰鸣。必须继续向山里走。'));}}
function balance(g,v){if(f(g,'lift'))return g.toast('轿厢已经停稳，安全锁扣住了配重。不要再拆动它。');g.s.weights=g.s.weights.includes(v)?g.s.weights.filter(x=>x!==v):[...g.s.weights,v];g.commit();g.sound('metal');let sum=g.s.weights.reduce((a,b)=>a+b,0);g.toast(sum===4?'横梁水平了。现在可以松开制动。':sum<4?'吊盘太轻，横梁向左沉。':'吊盘太重，横梁向右沉。');}
function lightTrail(g,id,item){let i=Number(id.slice(-1));if(item==='lamp'||item==='shade'){if(!f(g,'hood'+i))return one(g,'希尔达','风会从这里灌进去。先转一下灯罩。');set(g,'trail'+i);g.sound('warm');g.toast('一盏回家的灯亮了。');if([0,1,2].every(j=>f(g,'trail'+j)))say(g,[['大卫','山那边……也亮了。'],['阿尔弗','她看见我们了！现在带孩子走过去。']]);}else if(!f(g,'hood'+i)){set(g,'hood'+i);g.toast('灯罩转到了背风侧。可以用提灯点火了。');}else g.toast(f(g,'trail'+i)?'这盏灯会一直亮到天明。':'在背包里选小提灯，再点这盏路灯。');}

function checkBeacon(g){if(Math.abs(g.s.beaconAngle-Math.atan2(Mechanisms.beacon.target[1]-Mechanisms.beacon.pivot[1],Mechanisms.beacon.target[0]-Mechanisms.beacon.pivot[0])*180/Math.PI)<Mechanisms.beacon.tolerance&&!f(g,'beacon')){set(g,'beacon');g.sound('warm');g.toast('光落在山脊星标上。云雾里，一只沃夫回应了你。');}else g.toast('调整光轴，让指针指向远处左上方的星标。');}

function maybeFinish(g){if(f(g,'hug')&&[0,1,2].every(i=>f(g,'tea'+i))&&!f(g,'ended')){set(g,'ended');book(g,'home');g.finish();}}
return {maybeFinish,checkBeacon,H,I,exit,f,say,one,wrong,set,need,advance,book,pipeCheck,balance,lightTrail};
});

/* src/story/index.js */
Homeward.define("story", ["content/catalog", "content/details", "scene/0/logic", "scene/1/logic", "scene/2/logic", "scene/3/logic", "scene/4/logic", "scene/5/logic", "scene/6/logic", "scene/7/logic", "scene/8/logic", "scene/9/logic", "scene/10/logic", "scene/11/logic"], (catalog, details, scene0, scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9, scene10, scene11) => {

const scenes=[scene0,scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,scene10,scene11];
const notes={...catalog.notes};
scenes.forEach((scene,index)=>{
  const detail=details[index],hotspots=scene.hotspots,act=scene.act;
  notes[detail.note]=[detail.title,detail.body];
  scene.hotspots=state=>[...hotspots(state),{...detail,label:'仔细看看 · '+detail.title,kind:'observe'}];
  scene.act=(game,id,item)=>{
    if(id!=='detail')return act(game,id,item);
    game.note(detail.note);game.say([['希尔达',detail.body]]);
  };
});
return {...catalog,notes,scenes};
});
