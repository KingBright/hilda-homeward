<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>归途 · 角色表演工作台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../src/ui/cast.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#152932;color:#ece1c7;font:15px/1.6 system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:start;gap:28px}h1{font-size:30px;font-weight:600;margin:4px 0 12px}p{color:#b7c5bf;margin:0 0 20px}.eyebrow{color:#d8b77c;letter-spacing:.17em;font-size:11px}a{color:#e0bf89}form{display:flex;align-items:end;flex-wrap:wrap;gap:14px;border-top:1px solid #ffffff1a;padding:22px 0}label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#c9d2c8}select,button,input{font:inherit;accent-color:#d8b77c}select,button{background:#253e47;color:#f0e2c5;border:1px solid #78908966;border-radius:7px;padding:9px 12px;min-height:42px}button{cursor:pointer}button[aria-pressed="true"]{background:#806849}.check{flex-direction:row;align-items:center;min-height:42px}.panels{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px}.panel{border:1px solid #b1c2b326;border-radius:14px;background:linear-gradient(155deg,#28424c,#1b3038);overflow:hidden}.panelTitle{padding:16px 20px 0;color:#c8d3c8;font-size:12px;letter-spacing:.08em}#castStage{width:100%;height:auto;display:block}#portrait{width:196px;height:225px;border-radius:30px;max-width:100%;margin:16px auto}#portrait svg{width:100%;height:100%}#speaker{font-size:18px;color:#e9c991;padding:0 20px}#subtitle{min-height:100px;padding:10px 20px 20px;margin:0;font-size:14px;color:#d6ded1}.note{font-size:12px;margin-top:18px;max-width:940px}output{display:block;padding:10px 20px;border-top:1px solid #c8d3c817;color:#8da69f;font:12px/1.6 monospace}@media(max-width:850px){main{padding:18px}.panels{grid-template-columns:1fr}.portraitPanel{display:grid;grid-template-columns:150px 1fr}#portrait{width:130px;height:150px;grid-row:1/4}.portraitPanel .panelTitle{display:none}#speaker{padding-top:20px}#subtitle{min-height:0}header{display:block}h1{font-size:24px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">HOMEWARD / CAST STUDIO / V3.6</div><h1>角色表演工作台</h1><p>在同一张舞台上比较视线、口型与情绪。这里调用游戏源码，不维护另一套角色插画。</p></div><a href="../dev.html">进入开发版游戏 →</a></header>
<form onsubmit="return false" aria-label="角色预览控制">
<label>当前说话者<select id="castSelect"><option>希尔达</option><option>大卫</option><option>芙丽达</option><option>妈妈</option></select></label>
<label>剧情情绪<select id="sceneSelect"><option value="0">日常 · 好奇</option><option value="6">避雨处 · 温和</option><option value="9">屋顶 · 担忧与决心</option><option value="10">归途 · 放心</option></select></label>
<label>舞台方向<select id="facingSelect"><option value="1">正常</option><option value="-1">整体镜像</option></select></label>
<label>枝枝动作<select id="animalMode"><option value="idle">停步与嗅闻</option><option value="walk">慢走跟随</option><option value="trot">小跑与转向</option></select></label>
<label class="check"><input id="dialogueControl" type="checkbox" checked>对白演示</label>
<label class="check"><input id="reducedControl" type="checkbox">减少动态</label>
<button id="pauseControl" type="button" aria-pressed="false">暂停表演</button>
<button id="restartControl" type="button">从句首播放</button>
</form>
<div class="panels">
<section class="panel" aria-label="四角色舞台"><div class="panelTitle">共享舞台 / STAGE CAST</div><svg id="castStage" viewBox="0 0 1080 445" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="希尔达、大卫、芙丽达和妈妈的表演预览"></svg><output id="status">加载源码…</output></section>
<section class="panel portraitPanel" aria-label="共享对白头像"><div class="panelTitle">共享头像 / PORTRAIT</div><div id="portrait"></div><div id="speaker"></div><p id="subtitle"></p></section>
</div>
<section class="panel" style="margin-top:18px"><div class="panelTitle">枝枝 / 四足接触与独立跟随</div><svg id="animalStage" viewBox="0 0 1080 215" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg" aria-label="枝枝四足动作预览"></svg></section>
<p class="note">关闭「对白演示」可以查看人物独立的待机小动作；枝枝使用游戏内同一套跟随、落脚与停步表演。嘴形由文字节奏驱动，不是录音音素同步；工作台不播放音频、不读写游戏进度。暂停冻结当前表演，减少动态关闭口型循环与点头。返回游戏后仍需验证实际机关动作、遮挡和剧情节奏。</p>
</main>
<script src="../src/engine/modules.js"></script>
<script src="../src/engine/kinematics.js"></script>
<script src="../src/engine/idle-life.js"></script>
<script src="../src/engine/animal-life.js"></script>
<script src="../src/art/creature-life.js"></script>
<script src="../src/art/twig-design.js"></script>
<script src="../src/art/cast-design.js"></script>
<script src="../src/art/cast-acting.js"></script>
<script>
'use strict';
const Cast=Homeward.use('art/cast-design'),Acting=Homeward.use('art/cast-acting');
const names=['希尔达','大卫','芙丽达','妈妈'];
const lines={
 '希尔达':'找到朋友，然后一起回来。不落下任何一个，我保证。',
 '大卫':'等一等！我把这里扶稳，你们再慢慢过去。',
 '芙丽达':'先仔细看一看线索。我们一定能找到安全的办法。',
 '妈妈':'窗边会留着一盏灯，茶壶也还在炉子边。'};
const $=id=>document.getElementById(id),stage=$('castStage'),portrait=$('portrait');
let elapsed=0,previous=performance.now(),paused=false,animalTime=0;
const Animal=Homeward.use('engine/animal-life'),Creature=Homeward.use('art/creature-life'),follower=new Animal.Follower(360,1);
$('animalStage').innerHTML='<path d="M20 166H1060" stroke="#829887" opacity=".4"/><g id="twigPosition" transform="translate(360 160)"><g transform="scale(1.3)">'+Cast.twig()+'</g></g><g id="followTarget"><path d="M-8 0l8-12 8 12Z" fill="#d9b883"/></g>';
Creature.refresh($('animalStage'));
function redraw(){
 const scene=Number($('sceneSelect').value),face=Number($('facingSelect').value),who=$('castSelect').value;
 stage.innerHTML=Cast.defs+'<path d="M25 366H1055" stroke="#81988c" stroke-opacity=".25"/>'+names.map((name,i)=>
  `<g transform="translate(${145+i*265} 355) scale(${face*1.65} 1.65)">${Cast.standing(name,Cast.expression(scene,{},name))}</g><text x="${145+i*265}" y="402" text-anchor="middle" fill="#dbcca9" font-size="16">${name}</text>`).join('');
 portrait.innerHTML=`<svg viewBox="-45 -174 90 113" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${who}的对白头像">${Cast.standing(who,Cast.expression(scene,{},who))}</svg>`;
 $('speaker').textContent=who;
 Acting.refresh(stage);Acting.refresh(portrait);
 paint();
}
function paint(){
 const who=$('castSelect').value,scene=Number($('sceneSelect').value),line=lines[who];
 const position=Math.floor(elapsed*12)%(line.length+24),count=Math.min(line.length,position+1);
 const options={scene,speaker:$('dialogueControl').checked?who:'',listener:who==='希尔达'?'妈妈':'希尔达',typing:position<line.length,character:line[position]||'',reduced:$('reducedControl').checked};
 Acting.paint(stage,elapsed,options);Acting.paint(portrait,elapsed,{...options,portrait:true});
 $('subtitle').textContent=$('dialogueControl').checked?line.slice(0,count):'不说话时，也会呼吸、看向身边的人，偶尔整理衣物或挎包。';
 const mode=$('animalMode').value,dt=Math.max(0,Math.min(.06,elapsed-animalTime));animalTime=elapsed;
 const target=mode==='idle'?360:mode==='walk'?540+300*Math.sin(elapsed*.22):540+330*Math.sin(elapsed*.94);
 follower.update(target,dt,{paused,reduced:options.reduced});
 $('twigPosition').setAttribute('transform',`translate(${follower.x.toFixed(3)} 160)`);
 $('followTarget').setAttribute('transform',`translate(${target.toFixed(2)} 190)`);
 Creature.paint($('animalStage'),elapsed,{paused,reduced:options.reduced,pet:follower.snapshot(),ground:()=>160});
 const status=`${paused?'PAUSED':'PLAYING'} · ${who} · ${options.reduced?'REDUCED':'ANIMATED'} · ${elapsed.toFixed(1)}s`;
 if($('status').textContent!==status)$('status').textContent=status;
}
for(const id of ['castSelect','sceneSelect','facingSelect'])$(id).addEventListener('change',()=>{elapsed=0;redraw();});
$('dialogueControl').addEventListener('change',paint);
$('animalMode').addEventListener('change',()=>{follower.reset(360,1);animalTime=elapsed;paint();});
$('reducedControl').addEventListener('change',()=>{document.body.classList.toggle('reduced',$('reducedControl').checked);paint();});
$('pauseControl').addEventListener('click',()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('pauseControl').setAttribute('aria-pressed',String(paused));$('pauseControl').textContent=paused?'继续表演':'暂停表演';paint();});
$('restartControl').addEventListener('click',()=>{elapsed=0;paint();});
document.addEventListener('visibilitychange',()=>{previous=performance.now();document.body.classList.toggle('paused',paused||document.hidden);});
function tick(now){const dt=Math.min(.06,Math.max(0,(now-previous)/1000));previous=now;if(!paused&&!document.hidden){elapsed+=dt;paint();}requestAnimationFrame(tick);}
redraw();requestAnimationFrame(tick);
</script>
</body>
</html>
